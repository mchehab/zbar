name: Upload binaries to release

on:
  release:
    types:
      - created
      - published
      - edited

  workflow_dispatch:

permissions:
  contents: write

jobs:
  Ubuntu:
    name: Build for Ubuntu 22.04
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v7
    - name: prepare
      run: |
        sudo apt-get update
        sudo apt-get install -y meson ninja-build build-essential pkg-config \
                                devscripts lintian debhelper-compat dh-exec \
                                dh-sequence-python3 gettext xmlto \
                                gobject-introspection libgirepository1.0-dev \
                                libdbus-1-dev libjpeg-dev libmagick++-dev \
                                libv4l-dev libgtk-3-dev libgtk2.0-dev \
                                libqt5x11extras5-dev qtbase5-dev python3-dev
    - name: Debian package build
      run: |
        .github/workflows/debuilder.sh
        (cd ..; tar czf zbar-ubuntu-22.04.tar.gz *deb)

    - name: upload
      uses: softprops/action-gh-release@v3.0.3
      with:
        tag_name: ${{ github.event.release.tag_name }}
        files: ../zbar-ubuntu-22.04.tar.gz
        token: ${{ secrets.GITHUB_TOKEN }}

  Mac_OS:
    name: Build for Mac OS
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - name: prepare
      run: |
        brew install meson ninja libiconv graphicsmagick python pkg-config ccache gettext
    - name: configure and build
      run: |
        export CPPFLAGS="-I$(brew --prefix)/include"
        export LDFLAGS="-L$(brew --prefix)/lib"
        meson setup builddir --prefix=/usr/local -Dvideo=false -Dpython=python3
        meson compile -C builddir
        DESTDIR="$PWD/macos" meson install -C builddir
    - name: generating tarball
      run: |
        DIR="$PWD"
        tar c -C ${PWD}/macos -f ${DIR}/zbar-macos.tar.gz -z .
    - name: upload
      uses: softprops/action-gh-release@v3.0.3
      with:
        tag_name: ${{ github.event.release.tag_name }}
        files: ./zbar-macos.tar.gz
        token: ${{ secrets.GITHUB_TOKEN }}

  Windows:
    uses: ./.github/workflows/windows-zip.yml

  Upload_Windows:
    name: Upload Windows packages
    needs: Windows
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: zbar-win_*
        merge-multiple: true
        path: windows-packages
    - name: upload
      uses: softprops/action-gh-release@v3.0.3
      with:
        tag_name: ${{ github.event.release.tag_name }}
        files: windows-packages/*.zip
        fail_on_unmatched_files: true
        token: ${{ secrets.GITHUB_TOKEN }}
