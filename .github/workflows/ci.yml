name: CI

# Should run only on branches and PR, as "on_tag.yml" will handle tags
on:
  push:
    branches: [master, test]
  pull_request:
    branches: [master]

jobs:
#
# Linux
#
  Ubuntu:
    name: Ubuntu debuild
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: prepare
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config build-essential \
            devscripts debhelper-compat dh-exec dh-sequence-python3 \
            dh-sequence-meson lftp libdbus-1-dev libjpeg-dev \
            libmagick++-dev libv4l-dev libgtk-3-dev libgtk2.0-dev \
            libqt5x11extras5-dev qtbase5-dev python3-dev
      - name: build
        run: .github/workflows/debuilder.sh

  Ubuntu_Gtk2:
    name: Ubuntu with Gtk2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: prepare
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config meson ninja-build \
            libdbus-1-dev libjpeg-dev libv4l-dev libx11-dev libxext-dev libgtk2.0-dev
      - name: configure
        run: meson setup builddir -Dgtk=gtk2 -Dpython=no -Dqt=false -Djava=disabled -Ddoc=false
      - name: build
        run: meson compile -C builddir
      - name: check
        run: meson test -C builddir --print-errorlogs
      - name: install
        run: DESTDIR="$PWD/stage" meson install -C builddir

  Ubuntu_Gtk3:
    name: Ubuntu with Gtk3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: prepare
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config meson ninja-build \
            libdbus-1-dev libjpeg-dev libv4l-dev libx11-dev libxext-dev libgtk-3-dev
      - name: configure
        run: meson setup builddir -Dgtk=gtk3 -Dpython=no -Dqt=false -Djava=disabled -Ddoc=false
      - name: build
        run: meson compile -C builddir
      - name: check
        run: meson test -C builddir --print-errorlogs
      - name: install
        run: DESTDIR="$PWD/stage" meson install -C builddir

  Mingw_w64_VfW:
    name: Mingw-w64 VfW
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: prepare
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config gcc-mingw-w64 mingw-w64-i686-dev
      - name: configure
        run: |
          cat > mingw-cross.ini <<'EOF'
          [binaries]
          c = 'i686-w64-mingw32-gcc'
          cpp = 'i686-w64-mingw32-g++'
          ar = 'i686-w64-mingw32-ar'
          strip = 'i686-w64-mingw32-strip'
          [host_machine]
          system = 'windows'
          cpu_family = 'x86'
          cpu = 'i686'
          endian = 'little'
          EOF
          meson setup builddir --cross-file mingw-cross.ini \
            -Dgtk=no -Dpython=no -Dqt=false -Djava=disabled \
            -Dimagemagick=disabled -Djpeg=disabled -Ddbus=disabled -Dvideo=true
      - name: build
        run: meson compile -C builddir
      - name: install
        run: DESTDIR="$PWD/stage" meson install -C builddir

  Mingw_w64_DShow:
    name: Mingw-w64 DShow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: prepare
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config gcc-mingw-w64 mingw-w64-i686-dev
      - name: configure
        run: |
          cat > mingw-cross.ini <<'EOF'
          [binaries]
          c = 'i686-w64-mingw32-gcc'
          cpp = 'i686-w64-mingw32-g++'
          ar = 'i686-w64-mingw32-ar'
          strip = 'i686-w64-mingw32-strip'
          [host_machine]
          system = 'windows'
          cpu_family = 'x86'
          cpu = 'i686'
          endian = 'little'
          EOF
          meson setup builddir --cross-file mingw-cross.ini \
            -Dgtk=no -Dpython=no -Dqt=false -Djava=disabled \
            -Dimagemagick=disabled -Djpeg=disabled -Ddbus=disabled \
            -Dvideo=true -Ddirectshow=true
      - name: build
        run: meson compile -C builddir
      - name: install
        run: DESTDIR="$PWD/stage" meson install -C builddir

#
# Mac OS
#
  Mac_OS:
    name: Mac OS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: prepare
        run: brew install meson ninja pkg-config libjpeg-turbo
      - name: configure
        run: meson setup builddir -Dvideo=false -Dpython=no -Dgtk=no -Dqt=false -Djava=disabled -Ddoc=false
      - name: build
        run: meson compile -C builddir
      - name: check
        run: meson test -C builddir --print-errorlogs
      - name: install
        run: DESTDIR="$PWD/stage" meson install -C builddir

#
# Windows
#
  Windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2.32.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            meson
            ninja
            git
      - uses: actions/checkout@v7
      - name: configure
        run: meson setup builddir -Dvideo=false -Dgtk=no -Dpython=no -Dqt=false -Djava=disabled -Ddoc=false -Ddbus=disabled
      - name: build
        run: meson compile -C builddir
      - name: check
        run: meson test -C builddir --print-errorlogs
